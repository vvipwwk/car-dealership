  <style>

	:root{--input-bg:#fff;--muted-2:#475569;--label:#334155;--thumb-bg:radial-gradient(circle at 50% 25%,#fff 0%,#eef2f7 65%,#e2e8f0 100%);--row-hover:#fafcff;--cta-bg:linear-gradient(135deg,#eff6ff 0%,#fff 100%);--cta-border:#bfdbfe}
    [data-theme="dark"]{--bg:#060b16;--surface:#0f172a;--surface-2:#162035;--input-bg:#0b1324;--ink:#f1f5f9;--muted:#94a3b8;--muted-2:#cbd5e1;--label:#cbd5e1;--line:#1e293b;--primary:#3b82f6;--primary-soft:rgba(59,130,246,.16);--success:#10b981;--success-soft:rgba(16,185,129,.16);--warning:#f59e0b;--warning-soft:rgba(245,158,11,.16);--danger:#f87171;--danger-soft:rgba(248,113,113,.16);--thumb-bg:radial-gradient(circle at 50% 25%,#1e293b 0%,#0f172a 70%,#090e1a 100%);--row-hover:#17223a;--cta-bg:linear-gradient(135deg,#13213d 0%,#0f172a 100%);--cta-border:#1e3a8a;--shadow-sm:0 2px 8px rgba(0,0,0,.35);--shadow-md:0 18px 36px -8px rgba(0,0,0,.55);--shadow-lg:0 24px 48px -12px rgba(0,0,0,.65)}
    [data-theme="dark"] .input,[data-theme="dark"] select.input,[data-theme="dark"] textarea.input{background:var(--input-bg);color:var(--ink)}
    [data-theme="dark"] .field label{color:var(--label)}
    [data-theme="dark"] .car-thumb{background:var(--thumb-bg)}
    [data-theme="dark"] .spec-chip{color:var(--muted-2)}
    [data-theme="dark"] .modal,[data-theme="dark"] .modal-head,[data-theme="dark"] footer{background:var(--surface);color:var(--ink)}
    [data-theme="dark"] tr:hover td{background:var(--row-hover)}
    [data-theme="dark"] .buyer-cta{background:var(--cta-bg);border-color:var(--cta-border)}
    [data-theme="dark"] .icon-chip{background:rgba(15,23,42,.82);color:#fff;border-color:rgba(255,255,255,.18)}
    .theme-btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#e2e8f0;padding:6px 11px;border-radius:9px;font-size:.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
    .theme-btn:hover{background:rgba(255,255,255,.18);color:#fff}
    .angle-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
    .angle-tab{background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .16s ease;color:var(--ink);font-size:.74rem;font-weight:600}
    .angle-tab:hover{border-color:var(--primary);transform:translateY(-1px)}
    .angle-tab.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
    .angle-mini{width:100%;height:42px;border-radius:7px;background:var(--thumb-bg);overflow:hidden;display:grid;place-items:center}
    .angle-mini img{width:100%;height:100%;object-fit:cover}
    .angle-pill{position:absolute;bottom:10px;left:12px;z-index:2;background:rgba(11,18,32,.8);color:#fff;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:8px;backdrop-filter:blur(6px)}
	  
	.spotlight-car-anim,.spotlight-floor img{width:100%;height:100%;object-fit:cover;border-radius:12px}
	:root{--bg:#f3f5fa;--surface:#fff;--surface-2:#f8fafc;--ink:#0b1220;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--primary-soft:#eff6ff;--success:#059669;--success-soft:#ecfdf5;--warning:#d97706;--warning-soft:#fffbeb;--danger:#dc2626;--danger-soft:#fef2f2;--dark-nav:#070c17;--radius:16px;--shadow-sm:0 2px 6px rgba(15,23,42,.05);--shadow-md:0 16px 32px -8px rgba(15,23,42,.12);--shadow-lg:0 24px 48px -12px rgba(11,18,32,.22)}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden}
    h1,h2,h3,.brand,.car-price,.kpi-value{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif}
    button,input,select,textarea{font-family:inherit}
    .mode-bar{background:#0f172a;color:#cbd5e1;font-size:.78rem;padding:7px 20px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08)}
    .mode-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .mode-dot.live{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.28);animation:pulseDot 2s infinite}
    .mode-dot.local{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.28)}
    @keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
    .topbar{position:sticky;top:0;z-index:40;background:rgba(7,12,23,.92);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.09);transition:box-shadow .25s ease}
    .topbar.scrolled{box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;cursor:pointer}
    .brand-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(37,99,235,.35);transition:transform .25s ease}
    .brand:hover .brand-icon{transform:rotate(-6deg) scale(1.06)}
    .nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .nav-btn{background:transparent;border:none;color:#cbd5e1;padding:8px 13px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s ease;display:inline-flex;align-items:center;gap:6px}
    .nav-btn:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateY(-1px)}
    .nav-btn.active{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
    .pill-count{background:rgba(255,255,255,.2);color:#fff;padding:1px 6px;border-radius:999px;font-size:.72rem;font-weight:700}
    .user-pill{display:flex;align-items:center;gap:10px;font-size:.85rem;flex-wrap:wrap}
    .role-badge{padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:rgba(37,99,235,.25);color:#93c5fd;border:1px solid rgba(147,197,253,.25)}
    .role-badge.staff{background:rgba(16,185,129,.2);color:#6ee7b7;border-color:rgba(110,231,183,.25)}
    .mobile-toggle{display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font-size:1rem}
    .container{max-width:1280px;margin:0 auto;padding:28px 20px 80px;min-height:calc(100vh - 165px)}
    .view-enter{animation:viewFadeIn .35s cubic-bezier(.22,1,.36,1)}
    @keyframes viewFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .reveal{opacity:1;transform:translateY(0);transition:opacity .5s ease,transform .5s ease}
    .reveal.will-animate{opacity:0;transform:translateY(18px)}
    .reveal.will-animate.visible{opacity:1;transform:translateY(0)}
    .grid{display:grid;gap:22px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    @media(max-width:960px){.grid-4,.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.mobile-toggle{display:inline-flex}.nav-links,.user-pill{display:none;width:100%;padding-bottom:10px}.topbar.mobile-open .nav-links,.topbar.mobile-open .user-pill{display:flex}.topbar-inner{padding:12px 16px;flex-wrap:wrap}}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
    .card-pad{padding:24px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 17px;border-radius:11px;font-size:.875rem;font-weight:600;border:1px solid transparent;cursor:pointer;transition:all .18s ease;white-space:nowrap}
    .btn:active{transform:scale(.97)}
    .btn-sm{padding:7px 12px;font-size:.8rem;border-radius:9px}
    .btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.25)}
    .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
    .btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
    .btn-secondary:hover{background:var(--surface-2);border-color:#cbd5e1;transform:translateY(-1px)}
    .btn-success{background:linear-gradient(135deg,#059669,#047857);color:#fff;box-shadow:0 6px 16px rgba(5,150,105,.22)}
    .btn-success:hover{filter:brightness(1.05);transform:translateY(-1px)}
    .btn-danger{background:var(--danger-soft);color:var(--danger);border-color:#fecaca}
    .btn-danger:hover{background:#fee2e2}
    .btn-ghost{background:transparent;color:var(--muted)}
    .btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:.74rem;font-weight:700}
    .badge-available,.badge-confirmed,.badge-active,.badge-completed{background:var(--success-soft);color:var(--success)}
    .badge-reserved,.badge-pending{background:var(--warning-soft);color:var(--warning)}
    .badge-sold,.badge-cancelled,.badge-inactive{background:var(--danger-soft);color:var(--danger)}
    .badge-info{background:rgba(37,99,235,.2);color:#93c5fd;border:1px solid rgba(147,197,253,.28)}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .field label{font-size:.82rem;font-weight:600;color:#334155}
    .input,select.input,textarea.input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:.9rem;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
    .input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
    input[type="range"]{accent-color:var(--primary);cursor:pointer}
    .hero{position:relative;overflow:hidden;background:radial-gradient(circle at 82% 20%,rgba(37,99,235,.36),transparent 45%),radial-gradient(circle at 15% 85%,rgba(14,165,233,.18),transparent 40%),linear-gradient(135deg,#060a14 0%,#0d1629 55%,#111c34 100%);color:#fff;border-radius:24px;padding:44px 40px;display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center;box-shadow:var(--shadow-lg);margin-bottom:28px;border:1px solid rgba(255,255,255,.08)}
    @media(max-width:920px){.hero{grid-template-columns:1fr;padding:32px 22px}}
    .hero h1{margin:0 0 14px;font-size:clamp(2rem,3.4vw,2.95rem);line-height:1.09;letter-spacing:-.03em}
    .hero p{margin:0 0 24px;color:#cbd5e1;font-size:1.02rem;max-width:54ch}
    .hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12)}
    .hero-stat strong{display:block;font-size:1.45rem;font-weight:800}
    .hero-stat span{font-size:.8rem;color:#94a3b8}
    .spotlight-stage{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 100%);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px;backdrop-filter:blur(12px);transform-style:preserve-3d;transition:transform .2s ease-out}
    .spotlight-floor{position:relative;height:170px;border-radius:14px;background:radial-gradient(ellipse at center bottom,rgba(59,130,246,.22),rgba(15,23,42,.5) 70%);display:grid;place-items:center;overflow:hidden;margin-bottom:16px;border:1px solid rgba(255,255,255,.07)}
    .spotlight-floor::after{content:'';position:absolute;bottom:12px;width:72%;height:14px;background:radial-gradient(ellipse,rgba(255,255,255,.16),transparent 70%);border-radius:50%}
    .spotlight-car-anim{animation:floatCar 4.2s ease-in-out infinite;z-index:2}
    @keyframes floatCar{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .spotlight-progress{height:3px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:14px}
    .spotlight-progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#38bdf8);width:0%;transition:width .2s linear}
    .category-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px}
    .cat-pill{flex:1;min-width:135px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.9rem;box-shadow:var(--shadow-sm)}
    .cat-pill:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .cat-pill span{font-size:.76rem;color:var(--muted);font-weight:600;background:var(--surface-2);padding:2px 8px;border-radius:999px}
    .trust-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:34px 0 8px}
    @media(max-width:900px){.trust-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:540px){.trust-strip{grid-template-columns:1fr}}
    .trust-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow-sm)}
    .trust-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex-shrink:0}
    .buyer-cta{margin-top:30px;background:linear-gradient(135deg,#eff6ff 0%,#ffffff 100%);border:1px solid #bfdbfe;border-radius:18px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
    .car-card{display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;transform-style:preserve-3d}
    .car-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);border-color:#cbd5e1}
    .car-thumb{position:relative;height:192px;background:radial-gradient(circle at 50% 25%,#fff 0%,#eef2f7 65%,#e2e8f0 100%);display:grid;place-items:center;border-bottom:1px solid var(--line);overflow:hidden}
    .car-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
    .car-card:hover .car-thumb img{transform:scale(1.06)}
    .car-thumb svg{transition:transform .35s ease}
    .car-card:hover .car-thumb svg{transform:scale(1.06) translateY(-2px)}
    .car-thumb .badge{position:absolute;top:12px;right:12px;z-index:2}
    .car-thumb .year-pill{position:absolute;top:12px;left:12px;z-index:2;background:rgba(11,18,32,.85);color:#fff;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:8px}
    .thumb-tools{position:absolute;bottom:10px;right:10px;z-index:2;display:flex;gap:6px}
    .icon-chip{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:.74rem;font-weight:600;cursor:pointer}
    .icon-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .icon-chip.fav.active{background:#e11d48;border-color:#e11d48;color:#fff}
    .car-body{padding:18px 20px;display:flex;flex-direction:column;flex:1}
    .car-title{font-size:1.08rem;font-weight:700;margin:0 0 4px}
    .car-sub{font-size:.82rem;color:var(--muted);margin-bottom:12px}
    .car-price{font-size:1.32rem;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;margin-bottom:12px}
    .car-specs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
    .spec-chip{font-size:.75rem;background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:7px;color:#475569;font-weight:500}
    .car-actions{margin-top:auto;display:flex;gap:8px}
    .swatch-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
    .swatch-btn{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;transition:transform .15s}
    .swatch-btn:hover{transform:scale(1.18)}
    .swatch-btn.active{box-shadow:0 0 0 2px var(--primary);transform:scale(1.15)}
    .compare-tray{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:45;background:rgba(7,12,23,.94);backdrop-filter:blur(12px);color:#fff;padding:10px 18px;border-radius:14px;box-shadow:0 20px 35px rgba(0,0,0,.28);display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid rgba(255,255,255,.14);animation:slideUp .25s ease-out}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    th{text-align:left;padding:12px 14px;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
    td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#fafcff}
    .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:.84rem}
    .bar-label{width:130px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
    .bar-fill{height:100%;border-radius:999px;transition:width .7s ease}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .section-head h2{margin:0;font-size:1.5rem;letter-spacing:-.02em}
    .section-head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
    .kpi-card{padding:20px;transition:transform .2s ease,box-shadow .2s ease}
    .kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .kpi-label{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .kpi-value{font-size:1.75rem;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
    .kpi-note{font-size:.8rem;color:var(--muted)}
    .modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(7,12,23,.62);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
    .modal-backdrop.open{display:flex}
    .modal{background:#fff;border-radius:18px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.3);animation:modalPop .24s cubic-bezier(.22,1,.36,1)}
    @keyframes modalPop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
    .modal-head h3{margin:0;font-size:1.1rem}
    .modal-body{padding:22px}
    .toast-stack{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--dark-nav);color:#fff;padding:12px 16px;border-radius:12px;font-size:.875rem;font-weight:500;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:10px;animation:slideUp .22s ease-out;border-left:4px solid var(--primary)}
    .toast.success{border-left-color:var(--success)}

    function applyRevealAndCounters() {
      const els = document.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window) {
        els.forEach(el => el.classList.add('will-animate'));
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) { entry.target.classList.add('visible'); io.unobserve(entry.target); }
          });
        }, { threshold: 0.05 });
        els.forEach((el, i) => { el.style.transitionDelay = `${Math.min(i * 45, 220)}ms`; io.observe(el); });
      }
      document.querySelectorAll('[data-count]').forEach(el => {
        const target = Number(el.getAttribute('data-count') || 0);
        const isMoney = el.getAttribute('data-money') === '1';
        const start = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - start) / 500);
          const val = Math.round(target * (1 - Math.pow(1 - t, 3)));
          el.textContent = isMoney ? money(val) : val.toLocaleString();
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });
      if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
        document.querySelectorAll('.tilt-card').forEach(card => {
          card.addEventListener('mousemove', e => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            card.style.transform = `perspective(900px) rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 4).toFixed(2)}deg) translateY(-5px)`;
          });
          card.addEventListener('mouseleave', () => { card.style.transform = ''; });
        });
      }
    }

      };

    async function syncFromSupabase(passedSession = null) {
      if (!isCloudMode || !sb) return false;
      try {
        let session = passedSession;
        if (!session) {
          const res = await sb.auth.getSession();
          session = res?.data?.session || null;
        }
        if (session?.user) {
          let { data: prof, error: profErr } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
          if (profErr) {
            toast('Profile read error: ' + profErr.message, 'error');
            return false;
          }
          if (!prof) {
            const fb = { id: session.user.id, email: session.user.email, full_name: session.user.user_metadata?.full_name || session.user.email.split('@')[0], phone: session.user.user_metadata?.phone || '', address: session.user.user_metadata?.address || '', portal_role: 'customer' };
            const { error: upErr } = await sb.from('profiles').upsert(fb);
            if (upErr) {
              toast('Profile create error: ' + upErr.message, 'error');
              return false;
            }
            prof = fb;
          }
          state.session = { type: prof.portal_role, id: prof.id, name: prof.full_name, email: prof.email, phone: prof.phone, address: prof.address, role: prof.portal_role === 'staff' ? 'Master Admin' : 'Buyer' };
        } else { state.session = null; }

        const { data: vRows } = await sb.from('vehicles').select('*').order('created_at', { ascending: false });
        state.db.vehicles = (vRows || []).map(mapVehicleFromDB);

        if (state.session) {
          const { data: bRows } = await sb.from('bookings').select('*').order('created_at', { ascending: false });
          state.db.bookings = (bRows || []).map(b => ({ id: b.id, vehicleId: b.vehicle_id, customerId: b.customer_id, customerName: b.customer_name, date: b.booking_date, timeSlot: b.time_slot, branch: b.branch, phone: b.phone, notes: b.notes || '', status: b.status, createdAt: (b.created_at || '').slice(0, 10) }));
          const { data: sRows } = await sb.from('sales').select('*').order('created_at', { ascending: false });
          state.db.sales = (sRows || []).map(s => ({ id: s.id, vehicleId: s.vehicle_id, vehicleLabel: s.vehicle_label, customerId: s.customer_id, customerName: s.customer_name, paymentMethod: s.payment_method, downPayment: Number(s.down_payment), tradeIn: Number(s.trade_in), totalAmount: Number(s.total_amount), monthlyInstallment: Number(s.monthly_installment), date: s.sale_date }));
          const { data: favRows } = await sb.from('saved_vehicles').select('vehicle_id').eq('user_id', state.session.id);
          state.db.savedIds = (favRows || []).map(f => f.vehicle_id);
          if (state.session.type === 'staff') {
            const { data: pRows } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
            state.db.customers = (pRows || []).filter(p => p.portal_role === 'customer').map(p => ({ id: p.id, name: p.full_name, email: p.email, phone: p.phone || '', address: p.address || '', joined: (p.created_at || '').slice(0, 10) }));
            if (!state.db.staff.length) state.db.staff = JSON.parse(JSON.stringify(DEFAULT_DATA.staff));
          }
        } else { state.db.bookings = []; state.db.sales = []; state.db.savedIds = []; }
        return true;
      } catch (err) {
        console.error(err);
        toast('Sync error: ' + err.message, 'error');
        return false;
      } finally { render(); }
    }

    async function hashPassword(str) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');

      return btoa(str);

    function getVehicleAngleUrl(v, angle) {
      if (angle === 'front') return v.imageFront || v.imageUrl || '';
      if (angle === 'side') return v.imageSide || v.imageUrl || '';
      if (angle === 'interior') return v.imageInterior || '';
      if (angle === 'back') return v.imageBack || '';

    function carMediaHTML(v, overrideColor = null, mirrored = false, angle = null) {
      const color = overrideColor || v.color;
      const flip = mirrored ? 'transform: scaleX(-1);' : '';
      const photo = angle ? getVehicleAngleUrl(v, angle) : (v.imageFront || v.imageSide || v.imageUrl || '');

      }
      if (angle === 'interior') {
        return `<svg viewBox="0 0 260 120" width="220" height="102" aria-hidden="true"><rect x="24" y="18" width="212" height="86" rx="14" fill="#0f172a"/><path d="M36 66 Q130 48 224 66 L224 96 L36 96 Z" fill="#1e293b"/><rect x="110" y="54" width="44" height="22" rx="4" fill="#38bdf8" opacity="0.85"/><circle cx="76" cy="74" r="21" fill="none" stroke="#cbd5e1" stroke-width="5"/><circle cx="76" cy="74" r="6" fill="${c}"/><line x1="76" y1="74" x2="58" y2="74" stroke="#cbd5e1" stroke-width="4"/><line x1="76" y1="74" x2="94" y2="74" stroke="#cbd5e1" stroke-width="4"/><line x1="76" y1="74" x2="76" y2="93" stroke="#cbd5e1" stroke-width="4"/><rect x="172" y="34" width="36" height="40" rx="8" fill="#334155"/><rect x="52" y="34" width="36" height="28" rx="8" fill="#334155"/></svg>`;

    async function handleLogin(e, portal) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get('email').trim().toLowerCase(), password = fd.get('password');

    if (isCloudMode && sb) {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return toast(error.message, 'error');
        const ok = await syncFromSupabase(data?.session || null);
        if (!ok) return;
        if (portal === 'staff' && state.session?.type !== 'staff') {
          await sb.auth.signOut();
          saveLocalSession(null);
          render();
          return toast('Access denied: only the designated Master Admin account can enter here.', 'error');
        }
        toast(`Welcome back, ${state.session?.name || email}!`, 'success');
        return navigate(state.session?.type === 'staff' ? 'staff-home' : 'cust-home');
    }

      if (portal === 'staff') {
        if (email !== MASTER_ACCOUNT.email.toLowerCase() || password !== MASTER_ACCOUNT.pass) {
          return toast('Invalid Master Admin email or password.', 'error');
        }
        saveLocalSession({ type: 'staff', id: MASTER_ACCOUNT.id, name: MASTER_ACCOUNT.name, email: MASTER_ACCOUNT.email, role: MASTER_ACCOUNT.role });
        toast('Welcome back, Master Admin!', 'success');
        return navigate('staff-home');
      }

      const pwHash = await hashPassword(password);
      const user = state.db.customers.find(c => c.email.toLowerCase() === email);
      if (!user || (user.passwordHash !== 'demo' && user.passwordHash !== pwHash)) return toast('Invalid buyer email or password.', 'error');
      saveLocalSession({ type: 'customer', id: user.id, name: user.name, email: user.email, phone: user.phone, address: user.address });
      toast(`Welcome back, ${user.name}!`, 'success'); navigate('cust-home');
    }

    async function handleBuyerRegister(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = fd.get('name').trim(), email = fd.get('email').trim().toLowerCase(), phone = fd.get('phone').trim(), password = fd.get('password');
      if (isCloudMode && sb) {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name, phone, address: (fd.get('address') || '').trim() } } });
        if (error) return toast(error.message, 'error');
        if (!data.session) return toast('Account created! Check your email to verify before signing in.', 'success');
        await syncFromSupabase(); toast('Buyer account created & signed in!', 'success');
        return navigate('cust-home');
      }
      const pwHash = await hashPassword(password);
      if (state.db.customers.some(c => c.email.toLowerCase() === email)) return toast('Email already registered.', 'error');
      const cust = { id: nextId('CUST', state.db.customers), name, email, phone, address: (fd.get('address') || '').trim(), passwordHash: pwHash, joined: new Date().toISOString().slice(0, 10) };
      state.db.customers.push(cust); saveLocalDB();
      saveLocalSession({ type: 'customer', id: cust.id, name: cust.name, email: cust.email, phone: cust.phone, address: cust.address });
      toast('Buyer account created!', 'success'); navigate('cust-home');
    }

    async function toggleFavorite(vehicleId) {
      const idx = state.db.savedIds.indexOf(vehicleId);

        if (!state.session) return toast('Sign in as a Buyer to save vehicles to your garage.', 'info');
        if (idx >= 0) { await sb.from('saved_vehicles').delete().match({ user_id: state.session.id, vehicle_id: vehicleId }); state.db.savedIds.splice(idx, 1); toast('Removed from Saved Garage.'); }
        else { await sb.from('saved_vehicles').insert({ user_id: state.session.id, vehicle_id: vehicleId }); state.db.savedIds.push(vehicleId); toast('Saved to your Garage!', 'success'); }
      } else {
        if (idx >= 0) { state.db.savedIds.splice(idx, 1); toast('Removed from Saved Garage.'); }
        else { state.db.savedIds.push(vehicleId); toast('Saved to your Garage!', 'success'); }

    async function submitBooking(e) {
    e.preventDefault();
    const fd = new FormData(e.target), vehicleId = fd.get('vehicleId'), date = fd.get('date'), timeSlot = fd.get('timeSlot');
    const v = state.db.vehicles.find(x => x.id === vehicleId);
    if (!v || v.status !== 'Available') return toast('Sorry, this vehicle is no longer Available.', 'error');

    if (isCloudMode && sb) {
      const { error } = await sb.rpc('create_vehicle_booking', {
        p_vehicle_id: vehicleId, p_booking_date: date, p_time_slot: timeSlot,
        p_branch: fd.get('branch'), p_phone: fd.get('phone'), p_notes: fd.get('notes')
      });
      if (error) return toast(error.message, 'error');
      await syncFromSupabase();
    } else {
      const id = 'BK-' + Math.floor(2050 + Math.random() * 7900);
      v.status = 'Reserved';
      state.db.bookings.unshift({ id, vehicleId, customerId: state.session.id, customerName: state.session.name, date, timeSlot, branch: fd.get('branch'), phone: fd.get('phone'), notes: fd.get('notes'), status: 'Pending', createdAt: new Date().toISOString().slice(0, 10) });
      saveLocalDB();
    }
    toast('Vehicle reserved! Test drive booking submitted.', 'success');
    navigate('book-record');
    }
	  
    function viewBuyCar() {
      if (!state.session) { toast('Please sign in as a Buyer to complete a purchase.', 'info'); return viewBuyerAuth(); }
      const v = state.db.vehicles.find(x => x.id === state.selectedVehicleId);
      if (!v || !canBuyerPurchase(v)) return `<div class="card empty-state">This vehicle is currently reserved or sold.</div>`;
      const defaultDown = Math.round(v.price * 0.2);
      return `
        <div style="max-width:860px;margin:0 auto;">
          <button class="btn btn-secondary btn-sm" style="margin-bottom:14px;" onclick="navigate('c-details','${escapeHtml(v.id)}')">&larr; Back to Vehicle</button>
          <div class="card card-pad">
            <h2 style="margin-top:0;">Purchase &amp; Financing Checkout</h2>
            <p style="color:var(--muted);">Vehicle: <strong>${v.year} ${escapeHtml(v.make)} ${escapeHtml(v.model)}</strong> — List Price: <strong>${money(v.price)}</strong></p>
            <form id="buyForm" onsubmit="submitPurchase(event,'${escapeHtml(v.id)}')">
              <div class="grid grid-2">
                <div class="field"><label>Payment Method</label><select class="input" name="method" id="payMethod" onchange="updateFinanceCalc(${v.price})"><option value="Auto Loan">Auto Loan Financing (3.5% APR)</option><option value="Full Cash">Full Cash / Bank Transfer</option></select></div>
                <div class="field"><label>Loan Tenure (Months)</label><select class="input" name="tenure" id="payTenure" onchange="updateFinanceCalc(${v.price})"><option value="36">36 Months</option><option value="48">48 Months</option><option value="60" selected>60 Months</option><option value="72">72 Months</option></select></div>
                <div class="field"><label>Down Payment ($)</label><input class="input" type="number" name="downPayment" id="payDown" min="0" max="${v.price}" value="${defaultDown}" oninput="document.getElementById('payDownRange').value=this.value;updateFinanceCalc(${v.price})" /><input type="range" id="payDownRange" min="0" max="${v.price}" step="500" value="${defaultDown}" oninput="document.getElementById('payDown').value=this.value;updateFinanceCalc(${v.price})" /></div>
                <div class="field"><label>Trade-In Allowance ($)</label><input class="input" type="number" name="tradeIn" id="payTrade" min="0" max="${v.price}" value="0" oninput="updateFinanceCalc(${v.price})" /></div>
              </div>
              <div class="card card-pad" style="background:var(--surface-2);margin:10px 0 18px;" id="financeSummary">${calcFinanceHTML(v.price, defaultDown, 0, 60, 'Auto Loan')}</div>
              <button class="btn btn-success" type="submit">Complete Vehicle Purchase</button>
            </form>
          </div>
        </div>`;
    }

    function calcFinanceHTML(price, down, trade, months, method) {
      const principal = Math.max(0, price - down - trade);
      if (method === 'Full Cash') return `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;"><div><div style="font-size:.82rem;color:var(--muted);">Total Balance Due</div><div style="font-size:1.5rem;font-weight:800;color:var(--primary);">${money(Math.max(0, price - trade))}</div></div><span class="badge badge-available">Zero Interest</span></div>`;
      const r = 0.035 / 12, monthly = principal === 0 ? 0 : Math.round((principal * r) / (1 - Math.pow(1 + r, -months)));
      return `<div class="grid grid-4"><div><div style="font-size:.78rem;color:var(--muted);">Financed Principal</div><strong>${money(principal)}</strong></div><div><div style="font-size:.78rem;color:var(--muted);">Est. Monthly</div><strong style="color:var(--primary);font-size:1.2rem;">${money(monthly)}/mo</strong></div><div><div style="font-size:.78rem;color:var(--muted);">Total Interest</div><strong>${money(Math.max(0, (monthly * months) - principal))}</strong></div><div><div style="font-size:.78rem;color:var(--muted);">Rate &amp; Term</div><strong>3.5% &bull; ${months} mo</strong></div></div>`;
    }

    function updateFinanceCalc(price) {
      const method = document.getElementById('payMethod').value, tenureEl = document.getElementById('payTenure');
      tenureEl.disabled = method === 'Full Cash';
      document.getElementById('financeSummary').innerHTML = calcFinanceHTML(price, Number(document.getElementById('payDown').value || 0), Number(document.getElementById('payTrade').value || 0), Number(tenureEl.value), method);
    }

    async function submitPurchase(e, vehicleId) {
      e.preventDefault();
      const v = state.db.vehicles.find(x => x.id === vehicleId), fd = new FormData(e.target);
      const method = fd.get('method'), tenure = Number(fd.get('tenure') || 60), down = Number(fd.get('downPayment') || 0), trade = Number(fd.get('tradeIn') || 0);
      const principal = Math.max(0, v.price - down - trade), r = 0.035 / 12;
      const monthly = method === 'Full Cash' ? 0 : Math.round((principal * r) / (1 - Math.pow(1 + r, -tenure)));
      const planLabel = method === 'Full Cash' ? 'Full Cash' : `Auto Loan (${tenure} mo)`;
      if (isCloudMode && sb) {
        const { error } = await sb.rpc('complete_vehicle_purchase', { p_vehicle_id: v.id, p_payment_method: planLabel, p_down_payment: down, p_trade_in: trade, p_monthly_installment: monthly });
        if (error) return toast(error.message, 'error');
        await syncFromSupabase();
      } else {
        v.status = 'Sold';
        state.db.sales.unshift({ id: nextId('INV', state.db.sales), vehicleId: v.id, vehicleLabel: `${v.year} ${v.make} ${v.model}`, customerId: state.session.id, customerName: state.session.name, paymentMethod: planLabel, downPayment: down, tradeIn: trade, totalAmount: v.price, monthlyInstallment: monthly, date: new Date().toISOString().slice(0, 10) });
        saveLocalDB();
      }
      toast('Congratulations! Vehicle purchase confirmed.', 'success'); navigate('book-record');
    }

    function viewBookRecord() {

      const id = state.session.id, myBookings = state.db.bookings.filter(b => b.customerId === id), mySales = state.db.sales.filter(s => s.customerId === id);
      return `

    async function saveVehicle(e, id) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const imageFront = (fd.get('imageFront') || '').trim();
      const imageSide = (fd.get('imageSide') || '').trim();
      const imageInterior = (fd.get('imageInterior') || '').trim();
      const imageBack = (fd.get('imageBack') || '').trim();
      const data = {
        id: id || nextId('CAR', state.db.vehicles),
        make: fd.get('make').trim(), model: fd.get('model').trim(), year: Number(fd.get('year')),
        price: Number(fd.get('price')), body: fd.get('body'), fuel: fd.get('fuel'),
        transmission: fd.get('transmission').trim(), mileage: Number(fd.get('mileage')),
        colorName: fd.get('colorName').trim(), color: fd.get('color'),
        branch: fd.get('branch'), status: fd.get('status'),
        imageUrl: imageFront || imageSide,
        imageFront, imageSide, imageInterior, imageBack,
        vin: fd.get('vin').trim(), description: fd.get('description').trim()
      };
      if (isCloudMode && sb) {
        const row = mapVehicleToDB(data);
        const { error } = id ? await sb.from('vehicles').update(row).eq('id', id) : await sb.from('vehicles').insert(row);
        if (error) return toast(error.message, 'error');
        await syncFromSupabase();
      } else {
        if (id) { const idx = state.db.vehicles.findIndex(x => x.id === id); if (idx >= 0) state.db.vehicles[idx] = data; } else state.db.vehicles.unshift(data);
        saveLocalDB();
      }
      toast(id ? 'Vehicle updated.' : 'New vehicle added.', 'success'); closeModal(); render();
    }

    async function deleteVehicle(id) {

      if (isCloudMode && sb) { const { error } = await sb.from('vehicles').delete().eq('id', id); if (error) return toast(error.message, 'error'); await syncFromSupabase(); }
      else { state.db.vehicles = state.db.vehicles.filter(v => v.id !== id); saveLocalDB(); }
      toast('Vehicle removed.'); render();
    }

    async function updateBookingStatus(id, status) {

          saveLocalDB();

      return `
        <div class="section-head"><div><h2>HR &amp; Staff Directory</h2><p>Internal dealership personnel &amp; payroll managed by Master Admin.</p></div><div style="display:flex;gap:10px;"><button class="btn btn-secondary" onclick="exportPayrollCSV()">Export Payroll CSV</button><button class="btn btn-primary" onclick="openStaffForm()">+ Add Employee</button></div></div>
        <div class="grid grid-3" style="margin-bottom:22px;"><div class="card kpi-card"><div class="kpi-label">Total Staff</div><div class="kpi-value" data-count="${state.db.staff.length}">${state.db.staff.length}</div><div class="kpi-note">Across departments</div></div><div class="card kpi-card"><div class="kpi-label">Active Personnel</div><div class="kpi-value" data-count="${state.db.staff.filter(s=>s.status==='Active').length}">${state.db.staff.filter(s=>s.status==='Active').length}</div><div class="kpi-note">On roster</div></div><div class="card kpi-card"><div class="kpi-label">Monthly Payroll</div><div class="kpi-value" data-count="${totalPayroll}" data-money="1">${money(totalPayroll)}</div><div class="kpi-note">Base salaries</div></div></div>
        <div class="card card-pad"><div class="table-wrap"><table><thead><tr><th>Emp ID</th><th>Name</th><th>Role</th><th>Department</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.db.staff.map(s => `<tr><td><strong>${escapeHtml(String(s.id).slice(0, 10))}</strong></td><td>${escapeHtml(s.name)}<br><span style="font-size:.78rem;color:var(--muted);">${escapeHtml(s.email)}</span></td><td>${escapeHtml(s.role)}</td><td>${escapeHtml(s.department)}</td><td>${money(s.salary)}</td><td><span class="badge badge-${s.status.toLowerCase()}">${escapeHtml(s.status)}</span></td><td><div style="display:flex;gap:6px;"><button class="btn btn-secondary btn-sm" onclick="openStaffForm('${escapeHtml(s.id)}')">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteStaff('${escapeHtml(s.id)}')">Remove</button></div></td></tr>`).join('')}</tbody></table></div></div>`;
    }
    function exportPayrollCSV() { exportCSV('apexdrive_hr_payroll.csv', ['ID','Name','Email','Role','Department','Monthly Salary','Status'], state.db.staff.map(s => [s.id,s.name,s.email,s.role,s.department,s.salary,s.status])); }

    function openStaffForm(id = null) {
      const s = id ? state.db.staff.find(x => x.id === id) : null;
      openModal(s ? 'Edit Employee' : 'Add Employee', `<form onsubmit="saveStaff(event,'${escapeHtml(id || '')}')"><div class="grid grid-2"><div class="field"><label>Full Name</label><input class="input" name="name" required value="${escapeHtml(s?.name || '')}" /></div><div class="field"><label>Email</label><input class="input" type="email" name="email" required value="${escapeHtml(s?.email || '')}" /></div><div class="field"><label>Phone</label><input class="input" name="phone" required value="${escapeHtml(s?.phone || '')}" /></div><div class="field"><label>Monthly Salary ($)</label><input class="input" type="number" name="salary" required value="${s?.salary || 4800}" /></div><div class="field"><label>Role</label><select class="input" name="role">${['Sales Executive','Showroom Manager','HR Specialist','Finance Officer'].map(o => `<option ${s?.role===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Department</label><select class="input" name="department">${['Sales','Human Resources','Finance','Operations'].map(o => `<option ${s?.department===o?'selected':''}>${o}</option>`).join('')}</select></div></div><div class="field"><label>Status</label><select class="input" name="status">${['Active','Inactive'].map(o => `<option ${s?.status===o?'selected':''}>${o}</option>`).join('')}</select></div><div style="display:flex;gap:10px;justify-content:flex-end;"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save Employee</button></div></form>`);
    }

    function saveStaff(e, id) {
      e.preventDefault();
      const fd = new FormData(e.target), name = fd.get('name').trim(), email = fd.get('email').trim(), phone = fd.get('phone').trim(), salary = Number(fd.get('salary')), role = fd.get('role'), department = fd.get('department'), status = fd.get('status');
      if (id) { const s = state.db.staff.find(x => x.id === id); Object.assign(s, { name, email, phone, salary, role, department, status }); }
      else state.db.staff.push({ id: nextId('STF', state.db.staff), name, email, phone, salary, role, department, status });
      saveLocalDB(); toast('Employee record saved.', 'success'); closeModal(); render();
    }
    function deleteStaff(id) { if (!confirm('Remove this employee record?')) return; state.db.staff = state.db.staff.filter(s => s.id !== id); saveLocalDB(); toast('Employee removed.'); render(); }

    function bootApp() {
      try {
        render();
        startSpotlightLoop();
        if (SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey) {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          s.onload = () => {
            if (window.supabase) {
              const safeAuthStorage = {
					getItem: (k) => safeGetStorage(window.localStorage, k),
					setItem: (k, v) => safeSetStorage(window.localStorage, k, v),
					removeItem: (k) => safeRemoveStorage(window.localStorage, k)
					};
				sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, {
				auth: { storage: safeAuthStorage }
			});
              isCloudMode = true;
              state.db = { vehicles: [], customers: [], staff: JSON.parse(JSON.stringify(DEFAULT_DATA.staff)), bookings: [], sales: [], savedIds: [] };
              state.session = null;
              render();
              syncFromSupabase();
              initRealtime();
            }
          };
          s.onerror = () => toast('Could not reach Supabase CDN; running in Local Mode.', 'error');
          document.head.appendChild(s);
        }
      } catch (err) {
        console.error(err);
        const app = document.getElementById('app');
        if (app) app.innerHTML = `<div class="card card-pad" style="border-left:4px solid #dc2626;"><h3>Startup Error</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp);
    else bootApp();
  </script>
</body>
</html>
